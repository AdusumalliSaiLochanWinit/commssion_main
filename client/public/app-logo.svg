<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 110" role="img" aria-label="National Food Products Company">
  <title>NFPC — National Food Products Company</title>
  <!-- Word-mark "nfpc" -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700">
    <text x="110" y="56" text-anchor="middle" font-size="56" fill="#7C2D8C" letter-spacing="-1">nfpc</text>
    <!-- Green leaf accent above the 'c' -->
    <path d="M 159 16
